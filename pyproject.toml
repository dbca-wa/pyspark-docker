[project]
name = "pyspark-docker"
version = "0.2.0"
description = "PySpark in a Docker container"
authors = [{ name = "Ashley Felton", email = "ashley.felton@dbca.wa.gov.au" }]
license = "Apache 2.0"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "azure-identity==1.24.0",
    "azure-storage-blob==12.26.0",
    "ipython>=9.4.0",
    "pyspark==3.5.6",
    "python-dotenv==1.1.1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 140
indent-width = 4

[tool.ruff.lint]
ignore = ["E265", "E501", "E722"]
